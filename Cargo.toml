[package]
name = "event_schedule_api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["tokio"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["chrono", "derive", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.1"
utoipa = { version = "5.0", features = ["axum_extras"] }
utoipa-axum = "0.1"
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }
uuid = { version = "1.29.1", features = ["serde"] }
