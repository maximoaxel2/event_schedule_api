valid-mode-values = [
   "presencial",
   "virtual"
]
default_campus = "IIT"

invalid_presentators = [
	"-",
	"N/A",
	"UACJ Campus IIT",
	"n.a", # No manchen quien puso n.a
	"Alumnos proximos a egresar" # Este es un "hailmary"
]

[valid-type-values] 
"conferencia" = "conferencia"
"taller" = "taller"
"foro" = "foro"
"concurso" = "concurso"
"ponencia" = "ponencia"
"presentación" = "presentación"
"curso" = "curso"
"deportiva" = "deportiva"
"cultural" = "cultural"
"otra" = "otra"
"conferencia magistral" = "conferencia magistral"
"visita de Campo" = "visita de campo"
"panel" = "panel"
"exposicion" = "exposicion"
"cátedra patrimonial" = "cátedra patrimonial"
"mesa de diálogo" = "mesa de diálogo"
"capacitación" = "capacitación"
default = "otra"

[column-types]
[column-types.first]
"Actividad" = "str"
"Fecha inicio" = "date"
"Fecha fin" = "date"
"Hora inicio" = "time"
"Hora fin" = "time"
"Tipo" = "str"
"Salón" = "str"
"Título" = "str"
"Ponente" = "str"	
"Empresa / Institución" = "str"	
"Maestro de ceremonias" = "str"
"Enlace" = "str|None"

# The normal name is the index, points to a list of alt names
[entity-colapse-map]
"UACJ" = ["Universidad Autónoma de Ciudad Juárez", "uacj"]
"IIT UACJ" = ["Instituto de Ingeniería y Tecnología-UACJ"]
"Jhonson & Jhonson" = ["Johnson"]
"Universidad Tecnológica Paso del Norte" = ["Universidad de Texas, El Paso (UTEP)"]
"Siemens" = ["SIEMENS"]